<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dovit Bridge</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mapping.css"><link rel="stylesheet" href="help.css"></head>
<body><header class="main-header"><span class="brand">D / 2.2</span><span class="product-name">Dovit Bridge</span><button id="help-open" data-i18n="help_title"></button><label><select id="language" aria-label="Sprache / Langue"><option value="de">Deutsch</option><option value="fr">Français</option></select></label><strong id="connection" data-state="waiting" role="status" data-i18n="Verbinde ...">Verbinde ...</strong></header>
<main><section class="intro"><p class="eyebrow" data-i18n="DEIN HAUS. SICHTBAR GEMACHT."></p><h1 id="workspace-title" data-i18n="main_title">Deine Geräte</h1><p id="workspace-subtitle" data-i18n="main_subtitle">Geräte zuordnen, prüfen und verwalten.</p><div id="control-notice" class="notice" data-i18n="Nur beobachten. Diese Oberflaeche sendet keine Schaltbefehle."></div></section>
<nav class="workspace-nav" data-i18n-label="main_navigation"><button id="nav-devices" aria-controls="graphic-panel" aria-current="page" data-i18n="nav_devices"></button><button id="nav-setup" aria-controls="onboarding-panel" data-i18n="nav_setup"></button><button id="nav-diagnosis" aria-controls="diagnosis-panel" data-i18n="nav_diagnosis"></button></nav>
<section id="onboarding-panel" aria-labelledby="nav-setup" hidden>
<h2 data-i18n="wizard_title"></h2><p data-i18n="wizard_hint"></p><p id="wizard-simulation" class="notice" data-i18n="wizard_simulation" hidden></p><p id="wizard-damaged-warning" class="notice" role="alert" data-i18n="wizard_damaged_warning" hidden></p>
<aside id="wizard-runtime" aria-labelledby="wizard-current-title"><h3 id="wizard-current-title" data-i18n="wizard_current_title"></h3><p id="wizard-current-feedback" role="status" data-i18n="diagnosis_unknown"></p><details id="wizard-current-details"><summary data-i18n="wizard_current_details"></summary><p data-i18n="wizard_current_hint"></p></details></aside>
<form id="onboarding-form" autocomplete="off" novalidate>
<ol class="wizard-progress" role="list"><li data-step="0" data-i18n="wizard_dovit"></li><li data-step="1" data-i18n="wizard_mqtt"></li><li data-step="2" data-i18n="wizard_mappings"></li><li data-step="3" data-i18n="wizard_publication"></li></ol>
<fieldset data-wizard-step="0"><legend data-i18n="wizard_dovit"></legend><label><span data-i18n="wizard_host"></span><input id="setting-dovit_host" type="text" required maxlength="253"></label><label><span data-i18n="wizard_port"></span><input id="setting-dovit_port" type="number" min="1" max="65535" required></label></fieldset>
<fieldset data-wizard-step="1" hidden><legend data-i18n="wizard_mqtt"></legend><label><span data-i18n="wizard_mode"></span><select id="setting-mqtt_mode"><option value="manual" data-i18n="wizard_manual"></option><option value="supervisor" data-i18n="wizard_supervisor"></option></select></label><p data-i18n="wizard_supervisor_hint"></p><div id="mqtt-manual" class="wizard-fields" hidden><label><span data-i18n="wizard_host"></span><input id="setting-mqtt_host" type="text" maxlength="253"></label><label><span data-i18n="wizard_port"></span><input id="setting-mqtt_port" type="number" min="1" max="65535"></label><label><span data-i18n="wizard_user"></span><input id="setting-mqtt_user" type="text" maxlength="256" autocomplete="off"></label><label><span data-i18n="wizard_password"></span><input id="setting-mqtt_pass" type="password" maxlength="1024" autocomplete="new-password"><small data-i18n="wizard_password_hint"></small></label><label class="check"><input id="setting-mqtt_tls" type="checkbox"><span data-i18n="wizard_tls"></span></label><label><span data-i18n="wizard_protocol"></span><select id="setting-mqtt_protocol"><option value="3.1">3.1</option><option value="3.1.1">3.1.1</option><option value="5">5</option></select></label></div><p id="wizard-password-state"></p></fieldset>
<fieldset data-wizard-step="2" hidden><legend data-i18n="wizard_mappings"></legend><p data-i18n="wizard_mappings_hint"></p><button id="setup-go-devices" type="button" data-i18n="wizard_go_devices"></button></fieldset>
<fieldset data-wizard-step="3" hidden><legend data-i18n="wizard_publication"></legend><label class="check"><input id="setting-publish_discovery" type="checkbox"><span data-i18n="wizard_publish"></span></label><p data-i18n="wizard_publish_hint"></p><dl id="wizard-review"></dl><label class="check"><input id="wizard-confirm" type="checkbox"><span data-i18n="wizard_confirm"></span></label><label id="wizard-recovery-consent" class="check" hidden><input id="wizard-recovery-confirm" type="checkbox" aria-describedby="wizard-damaged-warning"><span data-i18n="wizard_recovery_consent"></span></label></fieldset>
<p id="wizard-status" role="status" aria-atomic="true"></p><div class="wizard-actions"><button id="wizard-back" class="wizard-secondary" type="button" data-i18n="wizard_back"></button><button id="wizard-next" class="wizard-primary" type="button" data-i18n="wizard_next"></button><button id="wizard-save" class="wizard-primary" type="submit" hidden disabled data-i18n="wizard_save"></button><button id="wizard-reload" class="wizard-secondary" type="button" data-i18n="wizard_reload"></button></div>
</form></section>
<section id="diagnosis-panel" aria-labelledby="nav-diagnosis" hidden><h2 data-i18n="nav_diagnosis"></h2><p id="diagnosis-guidance" role="status"></p><p id="diagnosis-mode" hidden></p><p id="diagnosis-changed"></p>
<details id="setup-panel" class="setup-panel"><summary data-i18n="setup_title"></summary><p id="setup-overview" role="status" aria-atomic="true"></p><ol class="setup-steps">
<li><span data-i18n="setup_dovit_label"></span><strong id="setup-dovit-status" data-state="unknown"></strong></li>
<li><span data-i18n="setup_mqtt_label"></span><strong id="setup-mqtt-status" data-state="unknown"></strong></li>
<li><span data-i18n="setup_devices_label"></span><strong id="setup-devices-status" data-state="unknown"></strong></li>
<li><span data-i18n="setup_publish_label"></span><strong id="setup-publishing-status" data-state="unknown"></strong></li>
<li><span data-i18n="setup_ha_label"></span><strong id="setup-ha-status" data-state="unknown"></strong></li>
</ol><p id="setup-automatic" hidden data-i18n="setup_automatic_hint"></p><p id="setup-next"></p><button id="setup-help" type="button" data-i18n="setup_help"></button></details>
<details id="diagnosis-advanced"><summary data-i18n="diagnosis_advanced"></summary><div id="advanced-editor-slot"></div></details></section>
<div id="graphic-panel" role="region" aria-labelledby="nav-devices">
<section id="empty-inventory" class="empty-inventory" aria-labelledby="empty-title" hidden><h2 id="empty-title" data-i18n="empty_inventory_title"></h2><p data-i18n="empty_inventory_hint"></p><p data-i18n="empty_inventory_restore"></p><div class="empty-actions"><button id="empty-setup" type="button" data-i18n="empty_inventory_setup"></button><button id="empty-help" type="button" data-i18n="setup_help"></button></div></section>
<section class="toolbar" data-i18n-label="Filter"><label><span data-i18n="Geraete suchen"></span><input id="search" data-i18n-placeholder="Name oder Dovit-ID" type="search"></label><label><span data-i18n="Kategorie"></span><select id="category"><option value="" data-i18n="Alle Kategorien"></option><option value="switches" data-i18n="Schalter"></option><option value="lights" data-i18n="Lichter"></option><option value="shutters" data-i18n="Rolllaeden"></option><option value="thermostats" data-i18n="Thermostate"></option><option value="motions" data-i18n="Bewegungsmelder"></option><option value="contacts" data-i18n="Kontakte"></option><option value="alarms" data-i18n="Alarm"></option><option value="clocks" data-i18n="clock_group"></option><option value="unknown" data-i18n="unknown_filter"></option></select></label></section>
<p id="session" role="status" data-i18n="Alle empfangenen Meldungen seit Bridge-Start. Zeitangaben in deiner Browser-Zeitzone."></p><p id="gap" role="alert"></p>
<section aria-live="polite"><p id="edit-status"></p><button id="edit-cancel" hidden data-i18n="edit_cancel"></button></section>
<section><div class="section-head"><h2 data-i18n="known_devices"></h2><span id="count"></span></div><div id="devices" class="device-groups"></div></section>
<section><div class="section-head"><h2 data-i18n="unknown_devices"></h2><span id="unknown-count"></span></div><p data-i18n="unknown_hint"></p><div id="unknown-devices" class="grid"></div></section>
<details id="observation-panel"><summary data-i18n="ui_discovery_tools"></summary><div class="observation-actions"><button id="observe" data-i18n="Beobachtung starten"></button><label class="check"><input id="repeats" type="checkbox"><span data-i18n="Wiederholungen anzeigen"></span></label></div>
<section class="timeline"><div class="section-head"><h2 data-i18n="Live-Ereignisse"></h2><span data-i18n="NEUESTE ZUERST / MAX. 500"></span></div><p data-i18n="Erstmeldung ist kein bestaetigter Zustandswechsel. Quelle (Schalter/App/Automation) unbekannt."></p><div id="events"></div></section></details></div>
<section id="json-panel" aria-labelledby="json-title" hidden>
<button id="json-return" type="button" data-i18n="json_return_devices"></button><h2 id="json-title" data-i18n="view_json"></h2><p id="json-hint" data-i18n="json_hint"></p>
<div class="json-editor-head"><p class="json-workflow" data-i18n="json_workflow"></p><details id="json-tools"><summary data-i18n="json_tools"></summary><div class="json-actions"><button id="json-load" type="button" data-i18n="json_load"></button><button id="json-format" type="button" disabled data-i18n="json_format"></button></div></details></div>
<label for="json-text">dovit_devices.json</label><textarea id="json-text" aria-describedby="json-hint json-status" spellcheck="false" autocapitalize="off" autocomplete="off" disabled></textarea>
<div class="json-actions"><button id="json-check" type="button" disabled data-i18n="edit_check"></button><button id="json-cancel" type="button" hidden data-i18n="edit_cancel"></button></div>
<p id="json-status" role="status" aria-atomic="true"></p>
<section id="json-review" aria-labelledby="json-review-title" hidden>
<h3 id="json-review-title" data-i18n="json_review_title"></h3><div id="json-readable-review"></div><details id="json-details"><summary data-i18n="json_details"></summary><pre id="json-summary" tabindex="0"></pre></details>
<label class="check"><input id="json-confirm" type="checkbox"><span data-i18n="edit_confirm_label"></span></label>
<label class="check" id="json-identity-label" hidden><input id="json-identity" type="checkbox"><span data-i18n="edit_identity"></span></label>
<div class="json-actions"><button id="json-save" type="button" disabled data-i18n="json_apply"></button></div>
</section>
</section></main><script src="i18n.js"></script><script src="setup.js"></script><script src="change-review.js"></script><script src="app.js"></script><script src="devices.js"></script><script src="json-editor.js"></script><script src="onboarding.js"></script><script src="help.js"></script></body></html>
