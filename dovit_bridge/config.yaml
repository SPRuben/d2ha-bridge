name: Dovit Bridge
version: "2.2"
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: Dovit Bridge
panel_admin: true
slug: local_dovit_bridge
description: Dovit TCP to MQTT bridge
url: https://github.com/SPRuben/dovit-bridge
stage: experimental

startup: services
boot: auto

host_network: true
services:
  - mqtt:want

arch:
  - amd64
  - aarch64

map:
  - share:rw

options:
  mqtt_mode: manual
  mqtt_tls: false
  mqtt_protocol: "3.1.1"
  web_light_control: false
  web_device_control: false
  dovit_host: "127.0.0.1"
  dovit_port: 6060
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
  devices_file: "/share/dovit_devices.json"
  cover_position_mode: "legacy"
  cover_position_file: "/share/dovit_cover_positions.json"
  enable_discovery: false
  publish_discovery: false
  alarm_code: ""

schema:
  mqtt_mode: list(manual|supervisor)?
  mqtt_tls: bool?
  mqtt_protocol: list(3.1|3.1.1|5)?
  web_light_control: bool?
  web_device_control: bool?
  dovit_host: str?
  dovit_port: port?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_pass: password?
  devices_file: str?
  cover_position_mode: list(legacy|timed)?
  cover_position_file: str?
  enable_discovery: bool
  publish_discovery: bool?
  alarm_code: password?
